<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok 距離管理（m確定システム付）</title>
    <style>
        :root { --primary: #fe2c55; --bg: #0f0f0f; --card: #1c1c1e; --accent: #25f4ee; }
        * { touch-action: manipulation; box-sizing: border-box; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        
        /* モード切替 */
        .mode-switch { margin-bottom: 15px; width: 100%; display: flex; gap: 10px; }
        .btn-mode { flex: 2; padding: 12px; border-radius: 12px; border: 2px solid var(--accent); background: transparent; color: var(--accent); font-weight: bold; cursor: pointer; }
        .btn-mode.active { background: var(--accent); color: #000; }
        
        /* 手動確定ボタン */
        .btn-convert { flex: 1; padding: 12px; border-radius: 12px; background: #fff; color: #000; border: none; font-weight: bold; font-size: 0.8rem; cursor: pointer; }

        /* メイン数値 */
        .main-card { background: var(--card); border-radius: 24px; padding: 25px; text-align: center; border: 1px solid #333; margin-bottom: 15px; }
        .dist-display { font-size: 3.2rem; font-weight: 900; color: var(--primary); margin: 5px 0; letter-spacing: -1px; line-height: 1.2; }
        .dist-display span { font-size: 1.5rem; color: #fff; margin-left: 5px; margin-right: 10px; }
        
        .edit-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; }
        .edit-row { display: flex; gap: 8px; align-items: center; justify-content: center; }
        .edit-row input { width: 90px; text-align: center; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; padding: 10px; font-size: 1rem; }
        .btn-set { background: var(--primary); color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }

        .history-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-hist { flex: 1; background: #3a3a3c; color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-hist:disabled { opacity: 0.2; }

        .gift-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-gift-wrap { position: relative; }
        .btn-gift { width: 100%; background: var(--accent); color: #000; border: none; padding: 22px 10px; border-radius: 16px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .count-badge { position: absolute; top: -5px; right: -5px; background: #fff; color: #000; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; border: 2px solid var(--accent); font-weight: 900; }

        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        input, select { background: #2c2c2e; border: 1px solid #3d3d3f; color: #fff; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn-add { background: #fff; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-file { flex: 1; background: #444; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
        
        .danger-zone { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding: 15px; border-top: 1px solid #333; width: 100%; }
        .btn-danger { background: none; border: none; color: #666; text-decoration: underline; font-size: 0.8rem; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="mode-switch">
        <button id="modeBtn" class="btn-mode" onclick="toggleAutoCalc()">自動換算：OFF</button>
        <button class="btn-convert" onclick="manualConvertMtoKm()">mをkmに<br>確定</button>
    </div>

    <div class="main-card">
        <div style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">現在の距離</div>
        <div class="dist-display"><span id="dispKm">0</span><span>km</span><span id="dispM">0</span><span>m</span></div>
        <div class="edit-group">
            <div class="edit-row"><input type="number" id="inputKm" placeholder="0"><span>km</span><button class="btn-set" onclick="setKm()">確定</button></div>
            <div class="edit-row"><input type="number" id="inputM" placeholder="0"><span>m</span><button class="btn-set" onclick="setM()">確定</button></div>
        </div>
    </div>

    <div class="history-controls">
        <button class="btn-hist" id="btnUndo" onclick="undo()">◀ 戻る</button>
        <button class="btn-hist" id="btnRedo" onclick="redo()">進む ▶</button>
    </div>

    <div class="gift-buttons" id="giftButtonContainer"></div>

    <div class="card">
        <strong style="display:block; margin-bottom:12px;">🎁 ボタン設定</strong>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input type="text" id="gName" placeholder="バラ" style="flex:2; margin:0">
            <input type="number" id="gVal" placeholder="10" style="flex:1; margin:0">
            <select id="gUnit" style="flex:1.5; margin:0"><option value="m">m</option><option value="km">km</option></select>
        </div>
        <button class="btn-add" onclick="addGiftSetting()">ボタンを追加</button>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-file" onclick="exportData()">JSON保存</button>
            <button class="btn-file" onclick="document.getElementById('fileInput').click()">読み込み</button>
            <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importData(event)">
        </div>
        <div id="giftList" style="margin-top:10px;"></div>
    </div>

    <div class="danger-zone">
        <button class="btn-danger" onclick="resetCountsOnly()">ギフトの回数(集計)だけをリセット</button>
        <button class="btn-danger" onclick="hardReset()">距離と集計をすべてリセット</button>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('v16_state')) || { km: 0, m: 0, pureKm: 0 };
    let isAutoCalc = JSON.parse(localStorage.getItem('v16_autocalc')) || false;
    let giftSettings = JSON.parse(localStorage.getItem('v16_settings')) || [
        { name: "バラ", val: 10, type: "m", count: 0 },
        { name: "指ハート", val: 50, type: "m", count: 0 }
    ];
    let history = [JSON.stringify({ state, isAutoCalc, giftSettings })];
    let historyStep = 0;

    // モード切替（自動換算スイッチ）
    function toggleAutoCalc() {
        isAutoCalc = !isAutoCalc;
        if (isAutoCalc) {
            // ON時：1000mを1kmにまとめる
            const totalM = ( (state.km - (state.pureKm || 0)) * 1000 ) + state.m;
            const extraKm = Math.floor(totalM / 1000);
            state.km = (state.pureKm || 0) + extraKm;
            state.m = totalM % 1000;
        } else {
            // OFF時：mボタン由来のkm分だけをmに解凍（pureKm分は残す）
            const mPartInKm = state.km - (state.pureKm || 0);
            state.m = (mPartInKm * 1000) + state.m;
            state.km = (state.pureKm || 0);
        }
        saveHistory();
        updateUI();
    }

    // ★今回の追加：mをkmに確定（手動換算ボタン）
    function manualConvertMtoKm() {
        if (state.m < 1) { alert("確定できるmがありません"); return; }
        if (confirm(`${state.m}m を kmに確定しますか？（確定後は解凍されません）`)) {
            const addedKm = Math.floor(state.m / 1000);
            const remainingM = state.m % 1000;
            
            // 換算したkmをpureKm（固定枠）に合流させる
            state.pureKm = (state.pureKm || 0) + addedKm;
            state.km = (state.pureKm || 0) + (isAutoCalc ? 0 : 0); 
            // state.km 自体は常にpureKm + (自動換算分)だが、モードによって表示を調整
            state.m = remainingM;

            // 整合性を保つため一旦全計算
            refreshState();
            saveHistory();
            updateUI();
        }
    }

    function refreshState() {
        if (isAutoCalc) {
            const totalM = ( (state.km - (state.pureKm || 0)) * 1000 ) + state.m;
            const extraKm = Math.floor(totalM / 1000);
            state.km = (state.pureKm || 0) + extraKm;
            state.m = totalM % 1000;
        } else {
            state.km = (state.pureKm || 0);
        }
    }

    function changeValue(index) {
        const g = giftSettings[index];
        g.count = (g.count || 0) + 1;
        
        if (g.type === "km") {
            state.km += g.val;
            state.pureKm = (state.pureKm || 0) + g.val;
        } else {
            state.m += g.val;
        }
        refreshState();
        saveHistory();
        updateUI();
    }

    function updateUI() {
        const btn = document.getElementById('modeBtn');
        btn.innerText = isAutoCalc ? "自動換算：ON" : "自動換算：OFF";
        btn.classList.toggle('active', isAutoCalc);

        document.getElementById('dispKm').innerText = state.km;
        document.getElementById('dispM').innerText = state.m;
        document.getElementById('btnUndo').disabled = (historyStep <= 0);
        document.getElementById('btnRedo').disabled = (historyStep >= history.length - 1);

        const btnContainer = document.getElementById('giftButtonContainer');
        btnContainer.innerHTML = "";
        giftSettings.forEach((g, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'btn-gift-wrap';
            wrap.innerHTML = `
                <button class="btn-gift" onclick="changeValue(${i})">${g.name}<br>(${g.val >= 0 ? "+" : ""}${g.val}${g.type})</button>
                <div class="count-badge">${g.count || 0}回</div>
            `;
            btnContainer.appendChild(wrap);
        });

        const list = document.getElementById('giftList');
        list.innerHTML = "";
        giftSettings.forEach((g, i) => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:10px; border-radius:10px; margin-top:8px;">
                <span>${g.name}(${g.val}${g.type}) - ${g.count || 0}回</span>
                <button onclick="deleteGift(${i})" style="background:#ff3b30; color:#fff; border:none; border-radius:5px; padding:5px 10px;">削除</button>
            </div>`;
        });

        localStorage.setItem('v16_state', JSON.stringify(state));
        localStorage.setItem('v16_autocalc', JSON.stringify(isAutoCalc));
        localStorage.setItem('v16_settings', JSON.stringify(giftSettings));
    }

    function setKm() { const v = parseFloat(document.getElementById('inputKm').value); if(!isNaN(v)){ state.km = v; state.pureKm = v; saveHistory(); updateUI(); document.getElementById('inputKm').value=""; } }
    function setM() { const v = parseFloat(document.getElementById('inputM').value); if(!isNaN(v)){ state.m = v; refreshState(); saveHistory(); updateUI(); document.getElementById('inputM').value=""; } }
    function saveHistory() { history = history.slice(0, historyStep + 1); history.push(JSON.stringify({ state, isAutoCalc, giftSettings: JSON.parse(JSON.stringify(giftSettings)) })); if (history.length > 50) history.shift(); historyStep = history.length - 1; }
    function undo() { if (historyStep > 0) { historyStep--; const d = JSON.parse(history[historyStep]); state = d.state; isAutoCalc = d.isAutoCalc; giftSettings = d.giftSettings; updateUI(); } }
    function redo() { if (historyStep < history.length - 1) { historyStep++; const d = JSON.parse(history[historyStep]); state = d.state; isAutoCalc = d.isAutoCalc; giftSettings = d.giftSettings; updateUI(); } }
    function addGiftSetting() { const n = document.getElementById('gName').value, v = parseFloat(document.getElementById('gVal').value), t = document.getElementById('gUnit').value; if (n && !isNaN(v)) { giftSettings.push({ name: n, val: v, type: t, count: 0 }); updateUI(); } }
    function deleteGift(i) { giftSettings.splice(i, 1); updateUI(); }
    function resetCountsOnly() { if (confirm("集計を0に戻しますか？")) { giftSettings.forEach(g => g.count = 0); saveHistory(); updateUI(); } }
    function hardReset() { if (confirm("すべてリセットしますか？")) { state = { km: 0, m: 0, pureKm: 0 }; giftSettings.forEach(g => g.count = 0); saveHistory(); updateUI(); } }
    function exportData() { const blob = new Blob([JSON.stringify({ state, giftSettings, isAutoCalc }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tiktok_tracker.json`; a.click(); }
    function importData(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const d = JSON.parse(e.target.result); state = d.state; giftSettings = d.giftSettings; isAutoCalc = d.isAutoCalc || false; history = [JSON.stringify({ state, isAutoCalc, giftSettings })]; historyStep = 0; updateUI(); alert("復元完了！"); } catch (err) { alert("失敗"); } }; reader.readAsText(file); }
    updateUI();
</script>
</body>
</html>
